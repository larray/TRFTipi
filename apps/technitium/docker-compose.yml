x-runtipi:
  schema_version: 2
services:
  technitium:
    image: docker.io/technitium/dns-server:15.4.0
    ports:
      - ${INTERNAL_IP}:53:53/tcp
      - ${INTERNAL_IP}:53:53/udp
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/dns
      - ${APP_DATA_DIR}/data/logs/:/var/log/technitium/dns
    x-runtipi:
      internal_port: "5380"
      is_main: true

