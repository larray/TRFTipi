x-runtipi:
  schema_version: 2
services:
  cupsd:
    image: olbat/cupsd:latest
    restart: unless-stopped
    ports:
      - 631:631/tcp
      - 631:631/udp
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /dev/bus/usb:/dev/bus/usb
    x-runtipi:
      internal_port: 631
      is_main: true

