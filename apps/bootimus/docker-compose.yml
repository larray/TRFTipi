x-runtipi:
  schema_version: 2
services:
  bootimus:
    container_name: bootimus
    image: garybowers/bootimus:0.1.80
    restart: unless-stopped
    hostname: bootimus
    ports:
      - "${NETWORK_INTERFACE:-0.0.0.0}:67:67/udp"
      - "${NETWORK_INTERFACE:-0.0.0.0}:69:69/udp"
      - "${NETWORK_INTERFACE:-0.0.0.0}:8080:8080/tcp"
      - "${APP_PORT}:8081/tcp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - TZ: ${TZ}
    cap_add:
      - NET_BIND_SERVICE
    x-runtipi:
      internal_port: "5000"
      is_main: true
