x-runtipi:
  schema_version: 2
services:
  bootimus:
    container_name: bootimus
    image: garybowers/bootimus:0.1.81
    restart: unless-stopped
    hostname: bootimus
    environment:
      BOOTIMUS_HTTP_PORT: "8082"
      BOOTIMUS_ADMIN_PORT: "8081"
    ports:
      - "69:69/udp"
      - "8082:8082/tcp"
      - "${APP_PORT}:8081/tcp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    cap_add:
      - NET_BIND_SERVICE
    x-runtipi:
      internal_port: "8081"
      is_main: true
